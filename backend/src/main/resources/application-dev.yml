# 개발 환경 설정
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop # 개발 환경에서는 자동 스키마 생성/삭제
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
    show-sql: true
  
  # 개발 환경 데이터베이스 설정 (H2 인메모리)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # SQL 스크립트 초기화 비활성화 (Hibernate가 스키마 관리)
  sql:
    init:
      mode: never
  
  # H2 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 개발용 Redis 설정 (선택사항)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000ms
      connect-timeout: 1000ms
      # Redis 연결 실패 시 애플리케이션 시작을 막지 않음
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  
  
  # DevTools 설정 (자동 재시작 비활성화)
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# 개발 환경 로깅
logging:
  level:
    com.bookreview: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
    org.apache.catalina: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"

# 개발 환경 JWT 설정 (짧은 만료 시간)
jwt:
  secret: dev-jwt-secret-key-for-bookreview-development-environment-minimum-256-bits-long
  expiration: 3600 # 1 hour for development
  refresh-expiration: 86400 # 24 hours for development

# 개발 환경 AI 서비스
ai:
  service:
    url: http://localhost:8000
    timeout: 60s # 개발 시에는 더 긴 타임아웃

# 개발 환경 파일 업로드
file:
  upload:
    path: ./uploads
    max-size: 50MB # 개발 시에는 더 큰 파일 허용

# 개발 환경 액추에이터 (모든 엔드포인트 노출)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI 설정 - 활성화
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true